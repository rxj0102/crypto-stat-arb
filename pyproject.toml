[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-stat-arb"
version = "0.1.0"
description = "Momentum and reversal in the cross-section of crypto, on a universe that includes delisted coins"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    'numpy==2.1.3',
    'pandas==2.2.3',
    'matplotlib==3.9.4',
]

[project.optional-dependencies]
dev = ['pytest>=7.4']

[tool.setuptools.packages.find]
include = ["statarb*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
