# ============================================================
# crypto-stat-arb  |  Central Experiment Configuration
# ============================================================

data:
  exchange: binance
  timeframes:
    daily: "1d"
    hourly: "1h"
  start_date: "2020-01-01"
  end_date: null          # null = today
  base_dir: data

universe:
  min_dollar_volume: 10_000_000   # $10M minimum ADTV
  min_history_days: 365           # 1 year minimum
  exclude_stablecoins: true
  exclude_wrapped: false

signals:
  momentum:
    lookbacks: [7, 14, 21, 42, 63, 126]   # days to test
    skip_days: [0, 1, 2, 3]               # skip parameter variants
    default_lookback: 63
    default_skip: 1
  reversal:
    lookbacks: [1, 2, 3, 5, 7]
    default_lookback: 5
  pairs:
    cointegration_lookback: 252
    zscore_window: 21
    entry_threshold: 1.5
    exit_threshold: 0.5
    min_pvalue: 0.05
  activity:
    volume_window: 21
    high_volume_threshold: 1.5
    min_ratio: 0.5

backtest:
  rebalance_freq: daily           # daily | weekly | monthly
  position_method: rank           # rank | signal | top_bottom | equal_weight | vol_target
  max_position: 0.10              # max weight per asset
  top_k: 10                       # for top_bottom method
  vol_target: 0.15                # 15% annual vol target
  vol_window: 63
  signal_lag: 1                   # periods to lag signal (lookahead prevention)
  return_type: log

execution:
  order_type: market              # market | limit
  market_order_cost: 0.0020       # 20 bps round-trip
  limit_order_cost: 0.0007        # 7 bps round-trip
  market_impact_bps_per_pct_adv: 5.0
  slippage_vol_multiplier: 0.1

evaluation:
  periods_per_year: 365           # crypto trades 24/7
  benchmark: "BTC/USDT"
  risk_free_rate: 0.0

combination:
  method: equal                   # equal | inverse_vol | sharpe | min_variance
  estimation_window: 63

synthetic:
  n_assets: 20
  n_days: 1000
  start_date: "2021-01-01"
  seed: 42

output:
  results_dir: experiments/results
  plots_dir: experiments/results/plots
  reports_dir: experiments/results/reports
